# Infra stack: postgres + minio + mockapi (§17 BUILD_SPEC).
# Usage: docker compose -f docker/docker-compose.infra.yml --env-file .env up -d
name: voicebank-infra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voicebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicebank}
      POSTGRES_DB: ${POSTGRES_DB:-voicebank}
    ports:
      - "5433:5432"   # dùng 5433 vì 5432 đã có PostgreSQL 18 native
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tự động chạy schema.sql khi container được tạo lần đầu
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voicebank}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mockapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    command: ["python", "-m", "mockapi.server"]
    environment:
      MOCKAPI_PORT: ${MOCKAPI_PORT:-18890}
      FEATURE_DEMO: ${FEATURE_DEMO:-false}
      DB_SOURCE: ${DB_SOURCE:-json}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${MOCKAPI_PORT:-18890}:18890"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
